name: Build APK

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug') }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Decode release keystore
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          for secret_name in KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_STORE_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required release secret: ${secret_name}"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Build release APK
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') }}
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Show build outputs
        if: ${{ always() }}
        run: |
          for build_type in debug release; do
            output_dir="app/build/outputs/apk/${build_type}"
            echo "=== ${build_type^} APK ==="
            if [ -d "$output_dir" ]; then
              find "$output_dir" -type f -name '*.apk' -exec ls -lh {} \;
            else
              echo "No ${build_type} APK built"
            fi
          done

      - name: Upload debug APK
        if: ${{ success() && !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug') }}
        uses: actions/upload-artifact@v7
        with:
          name: DexTouchpad-Shizuku-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload release APK
        if: ${{ success() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')) }}
        uses: actions/upload-artifact@v7
        with:
          name: DexTouchpad-Shizuku-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 60
          if-no-files-found: error

      - name: Upload build logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: Build-Logs
          path: |
            app/build/outputs/logs/
            app/build/reports/
            build/reports/
          retention-days: 7
          if-no-files-found: ignore

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v7
        with:
          name: DexTouchpad-Shizuku-Release
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.apk
          fail_on_unmatched_files: true
